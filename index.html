<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">nohub · 套件清單搜尋</title>
  <meta name="description" data-i18n-content="metaDesc" content="以 nohub packages/ 目錄快照為基礎的套件清單搜尋：依套件名稱、關鍵字、分類檢索，查看套件資訊與版本快照。" />
  <script>
    // 首屏渲染前确定主题与语言，避免闪烁：优先 localStorage，其次跟随系统偏好
    (function () {
      var LANGS = ['zh-CN', 'zh-TW', 'ja', 'ko', 'en', 'fr', 'ru', 'de', 'es', 'pt-BR'];
      function pickLang() {
        var l = localStorage.getItem('nohub-lang');
        if (LANGS.indexOf(l) !== -1) return l;
        var nav = String((navigator.language || '')).toLowerCase();
        if (!nav) return 'zh-TW';
        if (nav.indexOf('zh') === 0) return /(tw|hant|hk|mo)/.test(nav) ? 'zh-TW' : 'zh-CN';
        var base = nav.split(/[-_]/)[0];
        for (var i = 0; i < LANGS.length; i++) {
          if (LANGS[i].split('-')[0] === base) return LANGS[i];
        }
        return 'zh-TW';
      }
      try {
        var t = localStorage.getItem('nohub-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* file:// 等场景忽略 */ }
      try {
        document.documentElement.setAttribute('lang', pickLang());
      } catch (e) { /* file:// 等场景忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <div class="brand-logo">n</div>
        <div class="brand-text">
          <span class="brand-name">nohub</span>
          <span class="brand-sub" data-i18n="brandSub">套件清單搜尋</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="header-stats" id="headerStats"></div>
        <select class="lang-select" id="langSelect" aria-label="語言" data-i18n-aria-label="langLabel" title="語言" data-i18n-title="langLabel">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW" selected>傳統中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="ru">Русский</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="pt-BR">Português</option>
        </select>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切換深色 / 淺色主題" data-i18n-aria-label="themeAria" title="切換主題" data-i18n-title="themeTitle">
          <svg class="icon icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1 class="hero-title" data-i18n="heroTitle">搜尋收錄的社群套件</h1>
      <p class="hero-sub" data-i18n="heroSub">依套件名稱、關鍵字、分類檢索 glossary 等套件，查看套件資訊、版本快照與原始碼入口。</p>
      <div class="search-box" role="search">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="searchInput" type="text" placeholder="搜尋套件名稱、關鍵字、描述、作者…" data-i18n-ph="searchPlaceholder" autocomplete="off" spellcheck="false" />
        <button class="search-clear" id="searchClear" type="button" aria-label="清空搜尋" data-i18n-aria-label="clearSearch" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="search-kbd">
          <kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="kbdSelect">選擇</span>
          <kbd>↵</kbd> <span data-i18n="kbdDetail">詳情</span>
          <kbd>esc</kbd> <span data-i18n="kbdClear">清空</span>
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="layout">
      <div class="results-pane">
        <div class="results-meta" id="resultsMeta"></div>
        <div class="results" id="results"></div>
        <div class="empty" id="emptyState" hidden>
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          <p class="empty-title" data-i18n="noResults">找不到符合的套件</p>
          <p class="empty-sub" data-i18n="noResultsHint">試試更換關鍵字，或清除篩選條件</p>
          <button class="btn" id="emptyReset" type="button" data-i18n="resetFilters">清除搜尋與篩選</button>
        </div>
      </div>
      <aside class="detail-pane" id="detailPane" aria-live="polite"></aside>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span id="footerSource"></span>
      <span class="footer-sep">·</span>
      <span data-i18n="footerSourcePrefix">索引由 <code>web/build.mjs</code> 從 <code>packages/</code> 快照產生；線上讀取根層級 <code>latest.noml</code> / <code>packages/</code> 等 noml</span>
    </div>
  </footer>

  <!-- data.js 仅本地预览注入（app.js 在 localhost / file:// 下动态加载）；
       线上 gh-pages 不请求它，app.js 走 fetch + noml 解析 -->
  <script src="noml.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
