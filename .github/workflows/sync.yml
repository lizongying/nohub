name: sync

# nohub 同步工作流：作者记录（repos/**）变更后即时触发，每日定时兜底。
# 同步程序为 Nolang 版 sync（由 build.yml 在 tag 推送时构建并发布），
# 这里用 `no install sync:<version>@github.com/lizongying/nohub` 安装该生成物后运行，
# 拉取上游仓库的 workspace.noml / package.noml，
# 按全部语义化 tag 写入 workspaces/ packages/ 版本快照、根目录 latest.noml 与 state/sync.noml，
# 再重建 web/data.js 与 web/index.noml，一并提交回仓库；
# 同步默认是增量的：state 里记录过的版本直接跳过，只抓新增 tag（上次失败的最新版本会重试），
# 没有新版本时 state 时间戳也不刷新，避免每日产生空提交；手动可勾选 force 全量重抓。
# 随后把页面文件与根级 noml 数据（packages/ workspaces/ latest.noml）发布到 gh-pages。
on:
  schedule:
    - cron: '0 22 * * *'          # 每日 22:00 UTC = Asia/Shanghai 06:00
  workflow_dispatch:
    inputs:
      repo:
        description: '只同步 host/owner/repo，留空则全量'
        required: false
      force:
        description: '忽略增量状态，重新抓取全部版本'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    # repos/** 变更后即时同步；web/** 仅改页面时也要重新发布到 gh-pages
    paths: ['repos/**', 'web/index.html', 'web/app.js', 'web/styles.css', 'web/noml.js', 'web/i18n.js']

permissions:
  contents: write

env:
  # 与 build.yml 发布的 tag 对应；升级时同时改这里和 build.yml 的构建版本。
  SYNC_VERSION: v0.1.0

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # Disable automatic npm caching if not required

      # 安装编译器（no install 依赖 no 命令），再从本项目 Release 安装 Nolang 版 sync。
      - name: 安装 Nolang 编译器
        uses: lizongying/nolang/.github/actions/setup-nolang@main
        with:
          version: 'v0.4.32'

      - name: 安装 sync 生成物
        run: |
          no install "sync:${SYNC_VERSION}@github.com/lizongying/nohub"

      - name: 同步清单
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        # 直接调用 ~/no/bin 下的安装物，避免 /usr/local/bin 软链因权限失败时找不到命令。
        run: |
          "$HOME/no/bin/sync" sync ${{ inputs.repo }} --strict $FORCE

      - name: 重建索引
        run: node web/build.mjs

      - name: 回写快照
        run: |
          git add workspaces packages latest.noml state web/data.js web/index.noml web/noml.js
          git diff --cached --quiet && exit 0
          git -c user.name='nohub-bot' \
              -c user.email='nohub-bot@users.noreply.github.com' \
              commit -m 'sync: update manifests'
          git push

      # 搜索页部署在 gh-pages 分支：页面文件 + 根级 noml 数据（packages/ workspaces/ latest.noml）。
      # 线上页面首屏只 fetch index.noml（每包一条最新版本）即可渲染列表；
      # 点击卡片后才延迟请求该包的 latest.noml（版本索引）与 package.noml（详情）。
      - name: 同步搜索页（gh-pages）
        continue-on-error: true
        run: |
          set -e
          # checkout 默认只浅抓 main 一个分支，gh-pages 要显式取回；
          # 同时先记下 main 的 SHA，切分支后才仍取得到 web/ 与 packages/。
          SRC=$(git rev-parse HEAD)
          git fetch --depth 1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rf -q . || true
          for f in index.html app.js styles.css noml.js i18n.js; do git show "$SRC:web/$f" > "$f"; done
          git show "$SRC:latest.noml" > latest.noml
          git show "$SRC:web/index.noml" > index.noml
          git archive "$SRC" packages workspaces | tar -x
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name='nohub-bot' \
              -c user.email='nohub-bot@users.noreply.github.com' \
              commit -m 'pages: sync web + noml data'
          git push origin gh-pages
