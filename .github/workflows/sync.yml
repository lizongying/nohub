name: sync

# nohub 同步工作流：作者记录（repos/**）变更后即时触发，每日定时兜底。
# 同步程序为 Nolang 版 sync（源码在 sync/），这里用 build-nolang 从当前源码直接
# 构建 linux/amd64 二进制后运行，不依赖 build.yml 的 Release 生成物——
# 这样 repos/** 一变更就能同步，无需等 tag 发布，也不会跑过期的旧版本。
# 拉取上游仓库的 workspace.noml / package.noml，
# 按全部语义化 tag 生成 workspaces/ packages/ 版本快照、根目录 latest.noml 与 state/sync.noml，
# 再重建 web/index.noml；产物（含增量状态 state/sync.noml）只发布到 gh-pages，不回写 main。
# 每次同步先从 gh-pages 取回 state，实现增量：记录过的版本直接跳过，只抓新增 tag；
# 上次失败的最新版本会重试。手动可勾选 force 全量重抓。
on:
  schedule:
    - cron: '0 22 * * *'          # 每日 22:00 UTC = Asia/Shanghai 06:00
  workflow_dispatch:
    inputs:
      repo:
        description: '只同步 host/owner/repo，留空则全量'
        required: false
      force:
        description: '忽略增量状态，重新抓取全部版本'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    # repos/** 变更后即时同步；web/** 仅改页面时也要重新发布到 gh-pages
    paths: ['repos/**', 'web/index.html', 'web/app.js', 'web/styles.css', 'web/noml.js', 'web/i18n.js']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # Disable automatic npm caching if not required

      # 从源码构建同步程序：build-nolang 自带编译器下载 + std 源，不再需要
      # setup-nolang + no install 两步（后者依赖已发布 Release，会跑旧版本）。
      # v0.4.36+ 才有新格式资产（no-llvm-linux-amd64-vX.Y.Z）。
      - name: 构建 Nolang 版 sync
        id: build
        uses: lizongying/nolang/.github/actions/build-nolang@main
        with:
          version: 'v0.4.37'
          entry: sync
          name: sync
          targets: linux/amd64
          cc: zig
          fail-on-error: 'true'
          output-dir: dist

      # 增量同步的 state 持久化在 gh-pages（main 不跟踪产物）。同步前取回，
      # 让本次运行能从上次记录的版本继续，而不是每次都退化成全量抓取。
      # gh-pages 首次尚无 state 时忽略错误，sync 会按空 state 做首次全量。
      - name: 从 gh-pages 恢复同步状态
        continue-on-error: true
        run: |
          set -e
          git fetch --depth 1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          mkdir -p state
          git show origin/gh-pages:state/sync.noml > state/sync.noml

      - name: 同步清单
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        # 调用 build-nolang 产出的二进制（dist/sync-linux-amd64，未带版本后缀），
        # 与 build.yml 发布的资产区分：这里只为当前工作流构建运行，不发布。
        run: |
          ./dist/sync-linux-amd64 sync ${{ inputs.repo }} --strict $FORCE

      - name: 重建索引
        run: node web/build.mjs

      # 同步产物只发布到 gh-pages，不回写 main：main 由作者/维护者手动维护，
      # CI 不在 main 上产生提交，避免每日同步把 main 的历史刷满 manifest 更新。
      # 线上页面首屏只 fetch index.noml（每包一条最新版本）即可渲染列表；
      # 点击卡片后才延迟请求该包的 latest.noml（版本索引）与 package.noml（详情）。
      - name: 同步搜索页（gh-pages）
        continue-on-error: true
        run: |
          set -e
          # 同步与重建已在工作区生成产物，先整体搬到 runner 临时目录；
          # checkout -B gh-pages 会清空工作区，之后再从临时目录写回。
          STAGE="$RUNNER_TEMP/nohub-pages-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for f in index.html app.js styles.css noml.js i18n.js; do cp "web/$f" "$STAGE/$f"; done
          cp web/index.noml "$STAGE/index.noml"
          cp latest.noml "$STAGE/latest.noml"
          cp -R packages workspaces state "$STAGE/"

          # checkout 默认只浅抓 main 一个分支，gh-pages 要显式取回。
          git fetch --depth 1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rf -q . || true

          cp "$STAGE"/index.html "$STAGE"/app.js "$STAGE"/styles.css "$STAGE"/noml.js "$STAGE"/i18n.js .
          cp "$STAGE"/index.noml "$STAGE"/latest.noml .
          cp -R "$STAGE"/packages "$STAGE"/workspaces "$STAGE"/state .
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name='nohub-bot' \
              -c user.email='nohub-bot@users.noreply.github.com' \
              commit -m 'pages: sync web + noml data'
          git push origin gh-pages
